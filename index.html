<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff6ed" />
  <meta name="color-scheme" content="light" />
  <title>Menu · NomNom</title>
  <meta name="description" content="The menu, with videos and photos of every dish. Made by NomNom." />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16.png" />
  <link rel="apple-touch-icon" href="assets/brand/nomnom-512.png" />
  <link rel="preload" as="image" href="assets/brand/nomnom-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- dish photos and clips: open these connections early so the first cards show sooner -->
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="preconnect" href="https://assets.mixkit.co" />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Gabarito:wght@500..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <!-- The NomNom splash paints before any script or stylesheet arrives. -->
  <style>
    /* The background is a pair of cream stage curtains with soft folds. When the splash leaves, the logo goes first,
       then each curtain is drawn to its side: the fabric bunches up (folds get tighter) and the hem sweeps out ahead
       of the top, like a curtain being tied back, then fades so nothing is left over the menu. */
    .splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; overflow: hidden; background: transparent; }
    .splash-curtain { position: absolute; top: 0; bottom: 0; width: calc(50% + 1px); will-change: transform, clip-path;
      background:
        linear-gradient(180deg, rgba(120,80,40,.10), transparent 9%),
        repeating-linear-gradient(90deg, #fff7ee 0, #fbecdb 13px, #f1dcc4 22px, #fbecdb 31px, #fff7ee 44px); }
    .sc-l { left: 0; transform-origin: 0 50%; box-shadow: inset -18px 0 22px -14px rgba(110,70,30,.28); }
    .sc-r { right: 0; transform-origin: 100% 50%; box-shadow: inset 18px 0 22px -14px rgba(110,70,30,.28); }
    .splash.out .sc-l { animation: curtain-l 1.15s cubic-bezier(.6,0,.3,1) .25s forwards; }
    .splash.out .sc-r { animation: curtain-r 1.15s cubic-bezier(.6,0,.3,1) .25s forwards; }
    @keyframes curtain-l {
      0% { transform: scaleX(1); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity: 1; }
      45% { transform: scaleX(.62); clip-path: polygon(0 0, 100% 0, 62% 100%, 0 100%); opacity: 1; }
      80% { transform: scaleX(.2); clip-path: polygon(0 0, 100% 0, 30% 100%, 0 100%); opacity: 1; }
      100% { transform: scaleX(.12); clip-path: polygon(0 0, 100% 0, 22% 100%, 0 100%); opacity: 0; }
    }
    @keyframes curtain-r {
      0% { transform: scaleX(1); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); opacity: 1; }
      45% { transform: scaleX(.62); clip-path: polygon(0 0, 100% 0, 100% 100%, 38% 100%); opacity: 1; }
      80% { transform: scaleX(.2); clip-path: polygon(0 0, 100% 0, 100% 100%, 70% 100%); opacity: 1; }
      100% { transform: scaleX(.12); clip-path: polygon(0 0, 100% 0, 100% 100%, 78% 100%); opacity: 0; }
    }
    .splash-inner { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 14px; transition: opacity .3s ease, transform .35s cubic-bezier(.5,0,.75,0); }
    .splash.out .splash-inner { opacity: 0; transform: scale(.86); }
    .splash-by { margin: 0; font: 600 15px/1 'Figtree', system-ui, -apple-system, sans-serif; letter-spacing: .08em; color: #6b5a4a; animation: by-in .5s ease .1s both; }
    @keyframes by-in { from { opacity: 0; transform: translateY(6px); } }
    .splash-logo { width: min(56vw, 240px); aspect-ratio: 640 / 380; display: grid; grid-template-rows: 1fr 1fr; }
    .splash-logo span { background: url(assets/brand/nomnom-logo-t.png) no-repeat; background-size: 100% 200%; }
    .splash-logo .sl-top { background-position: 0 0; animation: chew-top .5s ease-in-out .2s 3; }
    .splash-logo .sl-bot { background-position: 0 100%; animation: chew-bot .5s ease-in-out .2s 3; }
    @keyframes chew-top { 50% { transform: translateY(9%); } }
    @keyframes chew-bot { 50% { transform: translateY(-9%); } }
    @media (prefers-reduced-motion: reduce) { .splash-logo span, .splash-by { animation: none; } .splash-inner { transition: opacity .3s; } .splash.out .splash-curtain { animation: none; opacity: 0; transition: opacity .3s; } }
  </style>
</head>
<body>
  <div id="splash" class="splash" role="img" aria-label="Menu powered by NomNom"><span class="splash-curtain sc-l"></span><span class="splash-curtain sc-r"></span><div class="splash-inner"><p class="splash-by">menu powered by</p><div class="splash-logo"><span class="sl-top"></span><span class="sl-bot"></span></div></div></div>
  <div id="app"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
