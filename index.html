<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff6ed" />
  <meta name="color-scheme" content="light" />
  <title>Menu · NomNom</title>
  <meta name="description" content="The menu, with videos and photos of every dish. Made by NomNom." />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16.png" />
  <link rel="apple-touch-icon" href="assets/brand/nomnom-512.png" />
  <link rel="preload" as="image" href="assets/brand/nomnom-logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- dish photos and clips: open these connections early so the first cards show sooner -->
  <link rel="preconnect" href="https://images.unsplash.com" />
  <link rel="preconnect" href="https://assets.mixkit.co" />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Gabarito:wght@500..800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <!-- The NomNom splash paints before any script or stylesheet arrives. -->
  <style>
    .splash { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #fff6ed; transition: opacity .45s ease, visibility 0s linear .45s; }
    .splash.out { opacity: 0; visibility: hidden; }
    .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .splash-by { margin: 0; font: 600 15px/1 'Figtree', system-ui, -apple-system, sans-serif; letter-spacing: .08em; color: #6b5a4a; animation: by-in .5s ease .1s both; }
    @keyframes by-in { from { opacity: 0; transform: translateY(6px); } }
    .splash-logo { width: min(56vw, 240px); aspect-ratio: 640 / 380; display: grid; grid-template-rows: 1fr 1fr; transition: transform .45s cubic-bezier(.16,1,.3,1); }
    .splash.out .splash-logo { transform: scale(1.08); }
    .splash-logo span { background: url(assets/brand/nomnom-logo.png) no-repeat; background-size: 100% 200%; }
    .splash-logo .sl-top { background-position: 0 0; animation: chew-top .5s ease-in-out .15s 2; }
    .splash-logo .sl-bot { background-position: 0 100%; animation: chew-bot .5s ease-in-out .15s 2; }
    @keyframes chew-top { 50% { transform: translateY(9%); } }
    @keyframes chew-bot { 50% { transform: translateY(-9%); } }
    @media (prefers-reduced-motion: reduce) { .splash-logo span, .splash-by { animation: none; } .splash, .splash-logo { transition: opacity .2s; } }
  </style>
</head>
<body>
  <div id="splash" class="splash" role="img" aria-label="Menu powered by NomNom"><div class="splash-inner"><p class="splash-by">menu powered by</p><div class="splash-logo"><span class="sl-top"></span><span class="sl-bot"></span></div></div></div>
  <div id="app"></div>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
